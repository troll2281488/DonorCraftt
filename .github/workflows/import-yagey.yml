name: Import YAGEY textures
on:
  workflow_dispatch:
  push:
    paths:
      - "yagey.zip"
      - "tools/import_yagey_textures.py"
      - ".github/workflows/import-yagey.yml"

permissions:
  contents: write

concurrency:
  group: yagey-texture-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Donorcraft
        uses: actions/checkout@v4
      - name: Verify archive and import matching textures
        run: |
          test -f yagey.zip
          python3 tools/import_yagey_textures.py
      - name: Commit imported textures
        run: |
          if git diff --quiet; then
            echo "No unambiguous texture matches found; inspect the import report above."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods
          git commit -m "Import matching textures from YAGEY pack"
          git push
